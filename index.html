<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>To Nonty ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow-x:hidden;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle,#54145d,#170522,#05000c);
 font-family:Arial,sans-serif;color:white;
 text-align:center;
}
.stars{
 position:fixed;inset:0;pointer-events:none;
 background-image:
 radial-gradient(2px 2px at 20% 30%,white,transparent),
 radial-gradient(2px 2px at 70% 20%,#ffb8f5,transparent),
 radial-gradient(2px 2px at 40% 80%,white,transparent),
 radial-gradient(2px 2px at 90% 70%,#d9b5ff,transparent);
 background-size:170px 170px;
 animation:twinkle 3s infinite alternate;
}
.card{
 position:relative;width:90%;max-width:500px;
 padding:35px 15px;margin:25px 0;
 border:1px solid #ff8ae8;border-radius:30px;
 background:#ffffff0d;
 box-shadow:0 0 35px #e600ff55;
 backdrop-filter:blur(8px);
}
h1{
 font-size:clamp(65px,17vw,110px);
 margin:15px 0;
 background:linear-gradient(90deg,#ff8bdc,#fff,#bd75ff);
 -webkit-background-clip:text;color:transparent;
 filter:drop-shadow(0 0 18px #ff00dd);
 animation:pulse 2s infinite;
}
h2{color:#ffd5f5;font-size:24px}
.message{
 font-size:25px;color:white;
 text-shadow:0 0 15px #ff5be7;
 margin:25px 0;
}
.small{color:#e8b9ff;line-height:2}
.rose{font-size:35px;margin:15px}
button{
 margin:12px 5px;padding:13px 23px;
 border:1px solid #ff8ae8;border-radius:30px;
 background:linear-gradient(90deg,#ff36ba,#a64dff);
 color:white;font-size:17px;
 box-shadow:0 0 20px #ff36ba;
}
.heart{
 position:fixed;top:-40px;color:#ff64d7;
 animation:fall linear forwards;pointer-events:none;
}
@keyframes pulse{
 50%{transform:scale(1.07)}
}
@keyframes twinkle{to{opacity:.4}}
@keyframes fall{
 to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>
<div class="stars"></div>

<main class="card">
 <div class="rose">🌹 💗 🌹</div>
 <h2>إلى أميرتي الجميلة</h2>
 <h1>𝑨♡𝑵</h1>

 <div class="message">
 أنتِ روح قلبي يا 𝑵𝒐𝒏𝒕𝒚
 </div>

 <div class="small">
 وجودك أجمل صدفة في حياتي ✨<br>
 وكل لحظة معاكي ليها حكاية جميلة 💗
 </div>

 <div class="rose">💞 🦋 💞</div>

 <button onclick="toggleMusic()" id="musicBtn">
 ▶️ شغّلي موسيقانا
 </button>

 <button onclick="showLove()">
 💌 رسالة ليكي
 </button>

 <p class="small">صُنعت بكل الحب ❤️</p>
</main>

<script>
let audioCtx=null;
let playing=false;
let timer=null;
let noteIndex=0;

const melody=[
[261.63,329.63,392],
[293.66,349.23,440],
[329.63,392,493.88],
[261.63,329.63,392],
[220,261.63,329.63],
[261.63,329.63,392]
];

function playNote(){
 if(!playing)return;
 if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();

 let notes=melody[noteIndex%melody.length];
 notes.forEach((freq,i)=>{
  let osc=audioCtx.createOscillator();
  let gain=audioCtx.createGain();
  osc.type="sine";
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(0.0001,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   i===0?0.09:0.035,audioCtx.currentTime+0.08
  );
  gain.gain.exponentialRampToValueAtTime(
   0.0001,audioCtx.currentTime+1.3
  );
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+1.4);
 });
 noteIndex++;
}

function toggleMusic(){
 const btn=document.getElementById("musicBtn");
 if(!playing){
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  playing=true;
  playNote();
  timer=setInterval(playNote,1400);
  btn.textContent="⏸️ إيقاف الموسيقى";
 }else{
  playing=false;
  clearInterval(timer);
  btn.textContent="▶️ شغّلي موسيقانا";
 }
}

function showLove(){
 alert("يا نونتي ❤️ أنتِ روح قلبي وأجمل حكاية في حياتي 🌹");
}

function makeHeart(){
 let h=document.createElement("div");
 h.className="heart";
 h.textContent=["♥","💗","💕","🌸","✨"][Math.floor(Math.random()*5)];
 h.style.left=Math.random()*100+"%";
 h.style.animationDuration=(4+Math.random()*5)+"s";
 h.style.fontSize=(15+Math.random()*25)+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),9000);
}
setInterval(makeHeart,300);
</script>
</body>
</html>
